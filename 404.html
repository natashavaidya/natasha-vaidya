<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 &mdash; Natasha Vaidya</title>
  <link rel="stylesheet" href="https://use.typekit.net/gkd2abq.css">
  <style>
    :root{--neon:#ff1493;--ink:#141414;--accent:#d39398;
      --font:"regulator-nova","Helvetica Neue",Arial,sans-serif;--w-light:300;--w-med:500;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;}
    body{font-family:var(--font);color:var(--ink);background:#fff;
      display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;letter-spacing:.03em;}
    .wrap{display:inline-block;padding:clamp(2rem,6vw,3.5rem);border:1px solid var(--neon);
      box-shadow:0 0 12px rgba(255,20,147,.3);}
    .code{font-weight:var(--w-light);font-size:clamp(3rem,12vw,6rem);color:var(--neon);line-height:1;letter-spacing:.06em;}
    .msg{font-weight:var(--w-light);text-transform:uppercase;font-size:1rem;margin:1.2rem 0 1.6rem;color:var(--ink);}
    .msg .sub{display:block;color:var(--accent);font-size:.8rem;margin-top:.5rem;letter-spacing:.05em;}
    a{color:var(--neon);text-decoration:none;text-transform:uppercase;font-weight:var(--w-med);font-size:.9rem;letter-spacing:.05em;}
    a:hover{color:#d6006e;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <p class="msg">Page not found<span class="sub">this fold leads nowhere</span></p>
    <a href="/">&larr; Return home</a>
  </div>
</body>
</html>
